name: Root Action license fixture

on:
  workflow_dispatch:

permissions: {}

jobs:
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: paladini/harness-score@6d4aace760e315554db49f6d6c244e24e6671b4c
        with:
          min-level: '0'
